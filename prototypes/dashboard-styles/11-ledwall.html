<!-- ПРОТОТИП (throwaway): вариант 11 · LED стена -->
<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>11 · LED стена</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --am:#ffb000; --am2:#ffd27a; --amd:rgba(255,176,0,.09);
  --gr:#3dff7a; --grd:rgba(61,255,122,.09);
  --rd:#ff4d3d; --wh:#f2f2f2;
  --tile:#17130b; --tile2:#0f0d07; --edge:#2a2210;
  --fs:clamp(13px, 1.0vw, 20px);
  --fsBig:clamp(20px, 1.7vw, 34px);
  --led:clamp(20px, 1.9vw, 38px);   /* височина на LED заглавие */
  --ledH:clamp(50px, 4.4vw, 86px); /* часовник / бюджет */
  --gap:clamp(8px, .7vw, 16px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:var(--am2);font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:var(--fs);line-height:1.25;text-transform:uppercase}
body{min-height:100vh;padding:var(--gap);overflow-x:hidden;
  background-image:radial-gradient(circle at 1.5px 1.5px, rgba(255,176,0,.07) 1px, transparent 1.3px);background-size:9px 9px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-transform:inherit}

/* --- LED матрица --- */
svg.led{display:inline-block;height:var(--led);width:auto;vertical-align:middle;filter:drop-shadow(0 0 2px rgba(255,176,0,.55)) drop-shadow(0 0 7px rgba(255,176,0,.25))}
svg.led.g{filter:drop-shadow(0 0 2px rgba(61,255,122,.55)) drop-shadow(0 0 7px rgba(61,255,122,.25))}
svg.led.r{filter:drop-shadow(0 0 2px rgba(255,77,61,.6)) drop-shadow(0 0 7px rgba(255,77,61,.3))}
svg.led.w{filter:drop-shadow(0 0 2px rgba(255,255,255,.5))}
svg.led.H{height:var(--ledH)}
svg.led.M{height:var(--fsBig)}
svg.led .on{fill:var(--am)}svg.led.g .on{fill:var(--gr)}svg.led.r .on{fill:var(--rd)}svg.led.w .on{fill:var(--wh)}
svg.led .off{fill:rgba(255,176,0,.11)}svg.led.g .off{fill:rgba(61,255,122,.1)}
.flk{animation:flk 3.1s steps(1) infinite}
@keyframes flk{0%,100%{opacity:1}37%{opacity:.94}38%{opacity:1}71%{opacity:.96}72%{opacity:1}}

/* --- табла --- */
.wall{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap)}
.bd{border:1px solid var(--edge);background:linear-gradient(#060503,#030302);padding:calc(var(--gap)*.8);min-width:0;position:relative;display:flex;flex-direction:column;gap:calc(var(--gap)*.6)}
.bd::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px);opacity:.5}
.bd>*{position:relative}
.hd{display:flex;align-items:center;gap:1em;flex-wrap:wrap}
.hd .sub{margin-left:auto;color:var(--am);opacity:.7;font-size:.85em}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}.c5{grid-column:span 5}

/* --- сплит-флап --- */
.row{display:flex;gap:.6em;align-items:center;min-width:0;overflow:hidden;padding:.08em 0}
.row+.row{border-top:1px dashed rgba(255,176,0,.12)}
.row:hover .fl i{background:#241d0e}
.fl{display:inline-flex;gap:1px;flex:none;white-space:nowrap}
.fl.grow{flex:1 1 auto;min-width:0;overflow:hidden;flex-wrap:wrap;height:1.35em}
.fl.grow.big{height:calc(var(--fsBig)*1.3)}
.row.wrap{flex-wrap:wrap;row-gap:4px}
.fl i{display:inline-block;width:.78em;height:1.35em;line-height:1.35em;text-align:center;font-style:normal;font-weight:600;color:var(--am2);background:var(--tile);border-radius:2px;position:relative;transition:background 160ms;flex:none}
.fl i::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.75)}
.fl.g i{color:var(--gr)}.fl.r i{color:var(--rd)}.fl.w i{color:#fff}.fl.dim i{color:rgba(255,210,122,.55)}
.fl.big i{font-size:var(--fsBig);width:.8em;height:1.3em;line-height:1.3em;border-radius:3px}
.done .fl i{color:rgba(255,210,122,.3)}
.done .fl.nm i{text-decoration:line-through}

/* --- LED точки / чекове --- */
.dot{width:.75em;height:.75em;border-radius:50%;background:var(--amd);flex:none;display:inline-block;box-shadow:inset 0 0 1px rgba(255,176,0,.3);transition:background 200ms,box-shadow 200ms}
.dot.on{background:var(--gr);box-shadow:0 0 6px var(--gr),0 0 14px rgba(61,255,122,.5)}
.dot.am{background:var(--am);box-shadow:0 0 6px var(--am),0 0 14px rgba(255,176,0,.5)}
.dot.rd{background:var(--rd);box-shadow:0 0 6px var(--rd),0 0 14px rgba(255,77,61,.5)}
.dot.pl{animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
.ckb{display:inline-flex;padding:.3em;margin:-.3em;align-items:center}
.ckb:active .dot{transform:scale(.8)}
.av{display:inline-flex;align-items:center;justify-content:center;width:1.4em;height:1.35em;border-radius:2px;font-weight:600;color:#000;flex:none;font-size:.95em}
.vote{display:inline-flex;align-items:center;gap:2px;flex:none}
.vote button{width:1.3em;height:1.35em;line-height:1;background:var(--tile);color:rgba(255,210,122,.35);border-radius:2px;font-size:.9em;transition:color 150ms,background 150ms,transform 120ms}
.vote button:hover{background:#241d0e;color:var(--am2)}
.vote button:active{transform:scale(.85)}
.vote button.on.up{color:var(--gr);text-shadow:0 0 6px var(--gr)}
.vote button.on.dn{color:var(--rd);text-shadow:0 0 6px var(--rd)}

/* --- горна лента --- */
.top{display:flex;align-items:center;gap:var(--gap);margin-bottom:var(--gap);flex-wrap:nowrap}
.top .clock{flex:none}
.top .meta{display:flex;flex-direction:column;gap:.4em;min-width:0;flex:1 1 0}
.top .syn{display:flex;gap:1.2em;flex-wrap:wrap;font-size:.82em}
.syn span{display:inline-flex;align-items:center;gap:.5em;white-space:nowrap}
.syn .warn{color:var(--am)}
.top .right{margin-left:auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:.5em;min-width:0;overflow:hidden}
.top .meta{overflow:hidden}

/* --- бюджет --- */
.bud{display:grid;grid-template-columns:1fr auto;gap:var(--gap);align-items:stretch}
.bud .col{display:flex;flex-direction:column;gap:.4em;min-width:0}
.bar{height:100%;min-height:150px}
.bar svg{height:100%;width:auto;display:block}
.small{font-size:.85em;color:rgba(255,210,122,.7)}
.small b{color:var(--am2);font-weight:600}
.wgt svg{width:100%;height:auto;display:block}

/* --- отговорност към екрани --- */
@media (max-width:1280px){
  :root{--fs:clamp(12px,1.35vw,16px)}
  .c6,.c4,.c3,.c5{grid-column:span 6}
}
@media (max-width:720px){
  :root{--fs:12px;--fsBig:20px;--led:20px;--ledH:46px;--gap:8px}
  .wall>.bd{grid-column:span 12}
  .hide-m{display:none!important}
  .top .right{margin-left:0;align-items:flex-start;text-align:left}
  .top{flex-wrap:wrap}.top .meta{flex-basis:100%}
  .o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}
  .fl i{width:.72em}
  .bud{grid-template-columns:1fr auto}
}
@media (prefers-reduced-motion:reduce){
  .flk,.dot.pl{animation:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="clock" id="clock"></div>
  <div class="meta">
    <div class="fl" id="date"></div>
    <div class="syn" id="syn"></div>
  </div>
  <div class="right">
    <div id="hdr"></div>
    <div class="fl dim" id="tag"></div>
  </div>
</header>
<main class="wall" id="wall"></main>

<script src="data.js"></script>
<script>
/* ---------- 5×7 LED глифове ---------- */
const G={};
const def=(chars,rows)=>{for(const c of chars)G[c]=rows.split(' ').map(r=>parseInt(r,2))};
def('0','01110 10001 10011 10101 11001 10001 01110');def('1','00100 01100 00100 00100 00100 00100 01110');
def('2','01110 10001 00001 00010 00100 01000 11111');def('3','11111 00010 00100 00010 00001 10001 01110');
def('4','00010 00110 01010 10010 11111 00010 00010');def('5','11111 10000 11110 00001 00001 10001 01110');
def('6','00110 01000 10000 11110 10001 10001 01110');def('7','11111 00001 00010 00100 01000 01000 01000');
def('8','01110 10001 10001 01110 10001 10001 01110');def('9','01110 10001 10001 01111 00001 00010 01100');
def(':','00000 00100 00100 00000 00100 00100 00000');def('.','00000 00000 00000 00000 00000 01100 01100');
def(',','00000 00000 00000 00000 01100 00100 01000');def('-−','00000 00000 00000 11111 00000 00000 00000');
def('+','00000 00100 00100 11111 00100 00100 00000');def('%','11000 11001 00010 00100 01000 10011 00011');
def('/','00000 00001 00010 00100 01000 10000 00000');def('×','00000 10001 01010 00100 01010 10001 00000');
def(' ','00000 00000 00000 00000 00000 00000 00000');def('→','00000 00100 00010 11111 00010 00100 00000');
def('(','00010 00100 01000 01000 01000 00100 00010');def(')','01000 00100 00010 00010 00010 00100 01000');
def('·','00000 00000 00000 00100 00000 00000 00000');
def('AА','01110 10001 10001 11111 10001 10001 10001');def('BВ','11110 10001 10001 11110 10001 10001 11110');
def('CС','01110 10001 10000 10000 10000 10001 01110');def('D','11100 10010 10001 10001 10001 10010 11100');
def('EЕ','11111 10000 10000 11110 10000 10000 11111');def('F','11111 10000 10000 11110 10000 10000 10000');
def('G','01110 10001 10000 10111 10001 10001 01111');def('HН','10001 10001 10001 11111 10001 10001 10001');
def('I','01110 00100 00100 00100 00100 00100 01110');def('J','00111 00010 00010 00010 00010 10010 01100');
def('KК','10001 10010 10100 11000 10100 10010 10001');def('L','10000 10000 10000 10000 10000 10000 11111');
def('MМ','10001 11011 10101 10101 10001 10001 10001');def('N','10001 10001 11001 10101 10011 10001 10001');
def('OО','01110 10001 10001 10001 10001 10001 01110');def('PР','11110 10001 10001 11110 10000 10000 10000');
def('Q','01110 10001 10001 10001 10101 10010 01101');def('R','11110 10001 10001 11110 10100 10010 10001');
def('S','01111 10000 10000 01110 00001 00001 11110');def('TТ','11111 00100 00100 00100 00100 00100 00100');
def('U','10001 10001 10001 10001 10001 10001 01110');def('V','10001 10001 10001 10001 10001 01010 00100');
def('W','10001 10001 10001 10101 10101 10101 01010');def('XХ','10001 10001 01010 00100 01010 10001 10001');
def('Y','10001 10001 10001 01010 00100 00100 00100');def('Z','11111 00001 00010 00100 01000 10000 11111');
def('Б','11111 10000 10000 11110 10001 10001 11110');def('Г','11111 10000 10000 10000 10000 10000 10000');
def('Д','00110 01010 01010 01010 01010 11111 10001');def('Ж','10101 10101 10101 01110 10101 10101 10101');
def('З','01110 10001 00001 00110 00001 10001 01110');def('И','10001 10001 10011 10101 11001 10001 10001');
def('Й','01010 00100 10001 10011 10101 11001 10001');def('Л','00111 01001 01001 01001 01001 01001 10001');
def('П','11111 10001 10001 10001 10001 10001 10001');def('У','10001 10001 10001 01111 00001 10001 01110');
def('Ф','00100 01110 10101 10101 10101 01110 00100');def('Ц','10010 10010 10010 10010 10010 11111 00001');
def('Ч','10001 10001 10001 01111 00001 00001 00001');def('Ш','10101 10101 10101 10101 10101 10101 11111');
def('Щ','10101 10101 10101 10101 10101 11111 00001');def('Ъ','11000 01000 01000 01110 01001 01001 01110');
def('Ь','10000 10000 10000 11110 10001 10001 11110');def('Ю','10010 10101 10101 11101 10101 10101 10010');
def('Я','01111 10001 10001 01111 00101 01001 10001');def('Ы','10001 10001 10001 11001 10101 10101 11001');
def('Э','01110 10001 00001 00111 00001 10001 01110');

/* текст → SVG матрица; непознат знак → текст с monospace като fallback */
function led(text,cls='',opts={}){
  text=String(text).toUpperCase();
  const chars=[...text];
  if(chars.some(c=>!G[c])) return `<span class="ledfb ${cls}" style="font-family:monospace;color:var(--am)">${esc(text)}</span>`;
  const W=chars.length*6-1, H=7, off=opts.off===false?'':'off';
  let s='';
  chars.forEach((c,ci)=>{const rows=G[c];for(let y=0;y<7;y++)for(let x=0;x<5;x++){const on=(rows[y]>>(4-x))&1;if(!on&&!off)continue;s+=`<circle class="${on?'on':'off'}" cx="${ci*6+x+.5}" cy="${y+.5}" r=".42"/>`}});
  return `<svg class="led ${cls} flk" viewBox="0 0 ${W} ${H}" style="animation-delay:-${(Math.random()*3).toFixed(2)}s" aria-label="${esc(text)}">${s}</svg>`;
}

/* ---------- сплит-флап ---------- */
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const ALPHA=' АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЪЯ0123456789-+:.';
const pend=new Map(); /* tile → {steps,target} */
let ticker=null;
function tick(){
  for(const [t,p] of pend){
    p.steps--;
    if(p.steps<=0){t.textContent=p.target;t.dataset.c=p.target;pend.delete(t)}
    else t.textContent=ALPHA[(Math.random()*ALPHA.length)|0];
    if(!RM) t.animate([{transform:'scaleY(1)'},{transform:'scaleY(.15)',offset:.5},{transform:'scaleY(1)'}],{duration:90});
  }
  if(!pend.size){clearInterval(ticker);ticker=null}
}
/* el: контейнер .fl ; text; len: фиксирана дължина (подравняване на колоните) */
function flap(el,text,len){
  text=String(text).toUpperCase();
  if(len!=null){text=[...text].slice(0,len);while(text.length<len)text.push(' ');text=text.join('')}
  const chars=[...text];
  if(el.children.length!==chars.length){el.innerHTML=chars.map(()=>'<i> </i>').join('');[...el.children].forEach(i=>i.dataset.c='')}
  [...el.children].forEach((t,i)=>{
    const c=chars[i]===' '?' ':chars[i];
    if(t.dataset.c===c)return;
    if(RM){t.textContent=c;t.dataset.c=c;return}
    pend.set(t,{steps:3+((i*7)%6)+Math.floor(Math.random()*3),target:c});
  });
  if(pend.size&&!ticker)ticker=setInterval(tick,75);
}
const F=(text,len,cls='')=>`<span class="fl ${cls}" data-t="${esc(text)}" data-l="${len==null?'':len}"></span>`;
function flapAll(root=document){root.querySelectorAll('.fl[data-t]').forEach(el=>{flap(el,el.dataset.t,el.dataset.l===''?null:+el.dataset.l);el.removeAttribute('data-t')})}
const av=w=>`<span class="av" style="background:${P[w].c}">${P[w].i}</span>`;

/* ---------- горе: часовник, дата, синхронизации ---------- */
function clock(){const d=new Date();const s=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;$('#clock').innerHTML=led(s,'H');}
clock();setInterval(clock,1000);
$('#date').outerHTML=F(`${DOWL[TODAY.getDay()]} · ${TODAY.getDate()} ${MON[TODAY.getMonth()]} ${TODAY.getFullYear()}`);
$('#syn').innerHTML=`<span><i class="dot on pl"></i>Календар · ${SYNC.cal}</span><span class="warn"><i class="dot am pl"></i>Wallet не отговаря · данни от ${SYNC.wallet}</span><span><i class="dot on pl"></i>Промоции · ${SYNC.promo}</span>`;
$('#hdr').innerHTML=led('СЕМЕЙНО ТАБЛО','M');
$('#tag').outerHTML=F('терминал 1 · wallet забавен');

/* ---------- табла ---------- */
const wall=$('#wall');
const board=(cls,title,sub,body)=>`<section class="bd ${cls}"><div class="hd">${led(title)}${sub?`<span class="sub">${sub}</span>`:''}</div>${body}</section>`;

/* 1. календар = заминавания */
const calRows=CAL.flatMap((c,ci)=>{const d=addD(TODAY,c.o);return c.ev.map((e,i)=>`<div class="row ${ci===0?'':'nxt'}">${F(ci===0?'днес':DOW[d.getDay()]+' '+String(d.getDate()).padStart(2,'0'),5,ci===0?'g':'dim')}${F(e.t,5)}${F(e.n,null,'grow'+(ci===0?' big':''))}${av(e.w)}</div>`)}).join('');
wall.insertAdjacentHTML('beforeend',board('c6 o1','ЗАМИНАВАНИЯ',`${CAL.reduce((a,c)=>a+c.ev.length,0)} събития · 4 дни`,
 `<div class="rows">${calRows}</div>`));

/* 7. тегло = LED графика от точки */
function ledGraph(){
  const C=64,R=9,pts=WEIGHT.pts,mn=Math.min(...pts,WEIGHT.goal)-.3,mx=Math.max(...pts)+.3;
  const ry=v=>Math.round((1-(v-mn)/(mx-mn))*(R-1));
  const lit=new Map();
  for(let x=0;x<C;x++){const f=x/(C-1)*(pts.length-1),i=Math.floor(f),t=f-i;const v=i>=pts.length-1?pts[pts.length-1]:pts[i]+(pts[i+1]-pts[i])*t;lit.set(x,ry(v))}
  const gy=ry(WEIGHT.goal);let s='';
  for(let y=0;y<R;y++)for(let x=0;x<C;x++){const on=lit.get(x)===y;const g=y===gy;s+=`<circle cx="${x+.5}" cy="${y+.5}" r=".38" fill="${on?'var(--am)':g?'rgba(61,255,122,.35)':'rgba(255,176,0,.1)'}"/>`}
  return `<svg viewBox="0 0 ${C} ${R}" style="filter:drop-shadow(0 0 3px rgba(255,176,0,.45))">${s}</svg>`;
}
const wl=WEIGHT.pts[WEIGHT.pts.length-1];
const WEIGHT_HTML=`<div class="hd" style="margin-top:auto">${led('ТЕГЛО','M')}<span class="sub">8 седмици</span></div>
  <div class="row" style="border:0;justify-content:space-between">${led(fmt(wl)+' КГ','M')}${led((wl-WEIGHT.pts[0]).toFixed(1).replace('.',','),'M g')}</div>
  <div class="wgt">${ledGraph()}</div>
  <div class="small">зелена линия = цел ${WEIGHT.goal} кг · още ${(wl-WEIGHT.goal).toFixed(1).replace('.',',')} кг</div>`;


/* 2. бюджет = LED стълб (+ тегло отдолу) */
function ledBar(){
  const R=22,C=4,lit=Math.round(pct/100*R),today=Math.round(dayPct/100*R);
  let s='';for(let y=0;y<R;y++)for(let x=0;x<C;x++){const row=R-1-y;const on=row<lit;const t=row===today-1;s+=`<circle cx="${x+.5}" cy="${y+.5}" r=".4" fill="${t?'#fff':on?(over?'var(--rd)':'var(--am)'):'rgba(255,176,0,.12)'}"/>`}
  return `<svg viewBox="0 0 ${C} ${R}" style="filter:drop-shadow(0 0 3px rgba(255,176,0,.5))">${s}</svg>`;
}
wall.insertAdjacentHTML('beforeend',board('c3 o2','БЮДЖЕТ',`ден ${BUDGET.day}/${BUDGET.days}`,
 `<div class="bud"><div class="col">
    <div id="rem">${led('0','H'+(over?' r':''))}</div>
    ${F('лв остават')}
    <div class="small" style="margin-top:.6em">похарчени <b>${fmt(BUDGET.spent)}</b> / ${fmt(BUDGET.limit)} лв · ${pct}%</div>
    <div class="small">~<b>${fmt(BUDGET.pace)} лв/ден</b> до края</div>
    <div class="small">▮ бяло = днес · ${dayPct}% от месеца</div>
  </div><div class="bar">${ledBar()}</div></div>${WEIGHT_HTML}`));

/* 3. днес се готви (+ тренировка отдолу) */
const m0=MENU[0];
const workRow=(w,i)=>`<div class="row ${STATE.work[i]?'done':''}" data-k="work" data-i="${i}"><button class="ckb" data-k="work" data-i="${i}" aria-label="отметни"><i class="dot ${STATE.work[i]?'on':''}"></i></button>${F(w.n,null,'grow nm')}${F(w.s,6,'dim')}</div>`;
wall.insertAdjacentHTML('beforeend',board('c3 o3','ДНЕС СЕ ГОТВИ','',
 `<div class="small">вечеря · gate ${m0.d}</div><div class="row wrap" style="border:0">${m0.dn.split(' ').map(w=>F(w,null,'big g')).join('')}</div>
  <div class="row" style="border:0">${F('обяд',4,'dim')}${F(m0.l,null,'grow')}</div>
  <div class="row" style="border:0">${av(m0.cook)}${F('готви '+P[m0.cook].n,null,'dim')}</div>
  <div class="hd" style="margin-top:auto">${led('ТРЕНИРОВКА','M')}<span class="sub">днес</span></div>
  <div id="work">${WORK.map(workRow).join('')}</div><div class="row" style="border:0;gap:.5em" id="workP"></div>`));

/* 10. рецепти = лента под менюто */
const RECIPES_HTML=`<div class="row" style="border:0;margin-top:auto;gap:1em;align-items:center">${led('РЕЦЕПТИ','M')}<span id="rc">${led('0','M')}</span>${F('в библиотеката',null,'dim')}<span id="rf" style="margin-left:auto">${led('0','M g')}</span>${F('нови',null,'g')}</div>`;

/* 4. меню = полети (+ рецепти отдолу) */
const vb=(i,w)=>{const v=STATE.votes[i][w];return `<span class="vote">${av(w)}<button class="up ${v===1?'on':''}" data-i="${i}" data-w="${w}" data-v="1" title="${P[w].n}: харесва">▲</button><button class="dn ${v===-1?'on':''}" data-i="${i}" data-w="${w}" data-v="-1" title="${P[w].n}: не харесва">▼</button></span>`};
wall.insertAdjacentHTML('beforeend',board('c5 o4','СЕДМИЧНО МЕНЮ','gate = ден · ▲▼ гласуване',
 `<div class="row" style="border:0"><span class="small" style="width:2.2em">gate</span><span class="small hide-m" style="width:11em">обяд</span><span class="small" style="flex:1">вечеря</span><span class="small">готви · гласове</span></div>
  ${MENU.map((m,i)=>`<div class="row" data-r="${i}">${F(m.d,2,i===0?'g':'')}<span class="hide-m">${F(m.l,14,'dim')}</span>${F(m.dn,null,'grow'+(i===0?' w':''))}${av(m.cook)}${vb(i,'D')}${vb(i,'S')}</div>`).join('')}${RECIPES_HTML}`));

/* 5. пазаруване */
const shopRow=(s,i)=>`<div class="row ${STATE.shop[i]?'done':''}" data-k="shop" data-i="${i}"><button class="ckb" data-k="shop" data-i="${i}" aria-label="отметни"><i class="dot ${STATE.shop[i]?'on':''}"></i></button>${F(s.n,null,'grow nm')}${F(s.q,6,'dim')}${s.promo?F(s.promo,12,'g'):`<span class="hide-m">${F(s.a,10,'dim')}</span>`}</div>`;
wall.insertAdjacentHTML('beforeend',board('c4 o4','ПАЗАРУВАНЕ','<span id="shopN"></span>',
 `<div id="shop">${SHOP.map(shopRow).join('')}</div>`));

/* 9. промоции = превъртащо се табло */
const PROMO_HTML=`<div class="hd" style="margin-top:auto">${led('ПРОМОЦИИ','M')}<span class="sub">${PROMO.length} оферти · превъртане на 5 с</span></div><div id="promo">${PROMO.map((p,i)=>`<div class="row">${F(p.s,5,'w')}${F(p.n,null,'grow')}${F(p.p,4,'g')}${F(p.until,5,'dim')}</div>`).join('')}</div>`;

/* 6. задачи (+ промоции отдолу) */
const taskRow=(t,i)=>`<div class="row ${STATE.tasks[i]?'done':''}" data-k="tasks" data-i="${i}"><button class="ckb" data-k="tasks" data-i="${i}" aria-label="отметни"><i class="dot ${STATE.tasks[i]?'on':''}"></i></button>${F(t.n,null,'grow nm')}${av(t.w)}${F(t.due,4,t.due==='днес'?'r':'dim')}</div>`;
wall.insertAdjacentHTML('beforeend',board('c3 o4','ЗАДАЧИ','<span id="taskN"></span>',
 `<div id="tasks">${TASKS.map(taskRow).join('')}</div>${PROMO_HTML}`));

flapAll();

/* ---------- броячи ---------- */
function count(el,v,cls,D=1100){const t0=performance.now();const f=now=>{const k=RM?1:Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);el.innerHTML=led(fmt(Math.round(v*e)),cls);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
count($('#rem'),BUDGET.rem,'H'+(over?' r':''));count($('#rc'),RECIPES.total,'M');count($('#rf'),RECIPES.fresh,'M g',700);

function counts(){
  const sN=STATE.shop.filter(Boolean).length,tN=STATE.tasks.filter(Boolean).length,wN=STATE.work.filter(Boolean).length;
  $('#shopN').textContent=`${sN}/${SHOP.length} в количката`;
  $('#taskN').textContent=`${tN}/${TASKS.length} готови`;
  $('#workP').innerHTML=WORK.map((_,i)=>`<i class="dot ${i<wN?'on':''}" style="width:1.1em;height:1.1em"></i>`).join('')+`<span class="small" style="margin-left:.5em">${wN}/${WORK.length} · ${Math.round(wN/WORK.length*100)}%</span>`;
}
counts();

/* ---------- взаимодействие ---------- */
wall.addEventListener('click',e=>{
  const b=e.target.closest('.ckb');
  if(b){const k=b.dataset.k,i=+b.dataset.i;STATE[k][i]=!STATE[k][i];const row=b.closest('.row');row.classList.toggle('done',STATE[k][i]);b.querySelector('.dot').classList.toggle('on',STATE[k][i]);counts();return}
  const v=e.target.closest('.vote button');
  if(v){const i=+v.dataset.i,w=v.dataset.w,val=+v.dataset.v;STATE.votes[i][w]=STATE.votes[i][w]===val?0:val;
    const vb=v.parentElement;vb.querySelector('.up').classList.toggle('on',STATE.votes[i][w]===1);vb.querySelector('.dn').classList.toggle('on',STATE.votes[i][w]===-1);
    const r=wall.querySelector(`.row[data-r="${i}"] .fl.grow`);flap(r,[...r.children].map(x=>x.textContent).join(''),null);}
});
/* при отметка „превъртаме“ името наново: нулираме кеша на плочките */
wall.addEventListener('click',e=>{const b=e.target.closest('.ckb');if(!b)return;const nm=b.closest('.row').querySelector('.fl.nm');[...nm.children].forEach(t=>{t.dataset.c=''});flap(nm,[...nm.children].map(x=>x.textContent).join(''),null)},true);

/* ---------- промоциите се превъртат ---------- */
let rot=0;
function rotatePromo(){
  rot++;const rows=[...$('#promo').children];
  rows.forEach((r,i)=>{const p=PROMO[(i+rot)%PROMO.length];const fls=r.querySelectorAll('.fl');flap(fls[0],p.s,5);flap(fls[1],p.n,null);flap(fls[2],p.p,4);flap(fls[3],p.until,5)});
}
if(!RM)setInterval(rotatePromo,5000);
</script>
</body>
</html>
