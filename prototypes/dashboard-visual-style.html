<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дашборд — визуален стил</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  ПРОТОТИП, НЕ ПРОДУКЦИОНЕН КОД.
  Въпрос: „Какъв визуален език и каква „живост“ (анимации) да има дашбордът, когато показва
  ВСИЧКИ фичъри от концепцията: календар, бюджет, днешно готвене, седмично меню с гласуване,
  списък за пазаруване, задачи, рецепти, тегло, тренировка, промоции?“
  Три радикално различни варианта на един екран, превключвани с ?variant=A|B|C (или #A|#B|#C)
  и със стрелките ← → на клавиатурата:
    A · Холограма  — sci-fi HUD: панели със скоби, радар, сканлайни, брояч на числа, тикер.
    B · Steampunk  — месинг и пергамент: зъбни колела, манометър за бюджета, сплит-флап календар,
                     перфориран билет за пазаруване, махало.
    C · Организъм  — биолуминесценция: радиална „клетка“ около днешния ден, дишащи ядра,
                     течност в бюджета, плаващи спори за промоциите.
  Фиктивни данни. Отметките, гласовете и „направено“ живеят само в паметта на страницата.
  Всеки вариант е нарочно в ЕДНА тема (A и C тъмни, B светъл) — това е част от въпроса.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&family=Cinzel+Decorative:wght@700;900&family=IM+Fell+English:ital@0;1&family=Special+Elite&family=Comfortaa:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Оформление: всеки вариант е самостоятелен „свят“ (.vA/.vB/.vC) със собствени токени и фон-канвас;
   общи са само данните, сцената и превключвателят. */
:root{
  --bg:#05070d; --fg:#e6f3ff; --accent:#38e0ff; --font-ui:"Rajdhani",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{margin:0;text-wrap:balance}
ul{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
canvas.bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.world{position:relative;z-index:1;min-height:100%;
  padding-block:1.2rem 7rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===== превключвател (не е част от дизайна) ===== */
#switcher{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;
  display:flex;align-items:center;gap:6px;background:#fff;color:#111;border-radius:999px;padding:6px 8px;
  box-shadow:0 4px 24px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.2);font:600 14px/1 system-ui,sans-serif;max-width:calc(100vw - 32px)}
#switcher button{width:34px;height:34px;border-radius:50%;background:#111;color:#fff;font-size:18px}
#switcher .lbl{padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#switcher .lbl small{opacity:.6;font-weight:500}

/* =================================================================================
   A · ХОЛОГРАМА
   ================================================================================= */
.vA{--bg:#03060f;--fg:#dff4ff;--mute:#6f93b3;--cy:#38e0ff;--mg:#ff4fd8;--am:#ffc44d;--ok:#5dffb0;--bad:#ff5a6a;
  --panel:rgba(8,24,46,.55);--line:rgba(56,224,255,.35);
  --f-display:"Orbitron",sans-serif;--f-mono:"Share Tech Mono",ui-monospace,monospace;--f-ui:"Rajdhani",sans-serif;
  background:var(--bg);color:var(--fg);font-family:var(--f-ui)}
.vA::after{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,0) 0 2px,rgba(0,0,0,.18) 2px 3px);mix-blend-mode:multiply}
.vA .top{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;border-bottom:1px solid var(--line);padding-bottom:.6rem}
.vA .brand{font-family:var(--f-display);font-weight:900;font-size:clamp(1.1rem,2.4vw,1.8rem);letter-spacing:.14em;text-transform:uppercase;position:relative;color:var(--cy);text-shadow:0 0 18px rgba(56,224,255,.6)}
.vA .brand::before,.vA .brand::after{content:attr(data-t);position:absolute;inset:0;opacity:.7;mix-blend-mode:screen}
.vA .brand::before{color:var(--mg);animation:aglitch 6s infinite steps(1)}
.vA .brand::after{color:var(--ok);animation:aglitch 6s infinite steps(1) reverse}
@keyframes aglitch{0%,92%,100%{transform:none;clip-path:inset(0)}93%{transform:translate(-3px,1px);clip-path:inset(20% 0 55% 0)}95%{transform:translate(3px,-1px);clip-path:inset(60% 0 10% 0)}97%{transform:translate(-2px,0);clip-path:inset(40% 0 40% 0)}}
.vA .clock{font-family:var(--f-mono);font-size:clamp(1.6rem,4vw,2.8rem);color:#fff;text-shadow:0 0 14px var(--cy);letter-spacing:.06em}
.vA .clock small{display:block;font-size:.4em;color:var(--mute);letter-spacing:.2em;text-transform:uppercase}
.vA .status{display:flex;gap:1.2rem;font-family:var(--f-mono);font-size:.78rem;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;flex-wrap:wrap}
.vA .status i{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);margin-right:.4em;animation:ablink 1.6s infinite}
.vA .status i.warn{background:var(--am);box-shadow:0 0 8px var(--am);animation-duration:.8s}
@keyframes ablink{50%{opacity:.25}}
.vA .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:.9rem}
.vA .p{position:relative;background:var(--panel);border:1px solid var(--line);padding:.9rem 1rem;backdrop-filter:blur(6px);min-width:0;
  clip-path:polygon(0 12px,12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);animation:aenter .7s both}
.vA .p:nth-child(n){animation-delay:calc(var(--i,0)*90ms)}
@keyframes aenter{from{opacity:.35;transform:translateY(10px) scale(.98);filter:brightness(1.8)}}
.vA .p::before,.vA .p::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--cy);pointer-events:none}
.vA .p::before{right:6px;top:6px;border-left:0;border-bottom:0}
.vA .p::after{left:6px;bottom:6px;border-right:0;border-top:0}
.vA .p h2{font-family:var(--f-display);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--cy);display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
.vA .p h2 span{font-family:var(--f-mono);color:var(--mute);letter-spacing:.05em;font-weight:400}
.vA .c3{grid-column:span 3}.vA .c4{grid-column:span 4}.vA .c5{grid-column:span 5}.vA .c6{grid-column:span 6}.vA .c7{grid-column:span 7}.vA .c8{grid-column:span 8}.vA .c12{grid-column:span 12}
@media (max-width:1100px){.vA .c3,.vA .c4,.vA .c5{grid-column:span 6}.vA .c7,.vA .c8{grid-column:span 12}}
@media (max-width:640px){.vA .grid>*{grid-column:span 12}}
/* календар */
.vA .cal{display:grid;grid-template-columns:minmax(150px,200px) 1fr;gap:1rem;align-items:start}
@media (max-width:640px){.vA .cal{grid-template-columns:1fr}.vA .radar{max-width:200px;margin:0 auto}}
.vA .radar{aspect-ratio:1;max-width:100%;border-radius:50%;border:1px solid var(--line);position:relative;overflow:hidden;
  background:radial-gradient(circle,rgba(56,224,255,.08),transparent 70%)}
.vA .radar::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(56,224,255,.55),rgba(56,224,255,0) 70deg);animation:aspin 4s linear infinite}
@keyframes aspin{to{transform:rotate(360deg)}}
.vA .radar::after{content:"";position:absolute;inset:0;border-radius:50%;background:
  repeating-radial-gradient(circle,transparent 0 24%,var(--line) 24% calc(24% + 1px)),linear-gradient(var(--line),var(--line)) 50% 0/1px 100% no-repeat,linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat}
.vA .radar b{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);transform:translate(-50%,-50%);animation:aping 2s infinite}
@keyframes aping{0%{box-shadow:0 0 0 0 var(--c)}100%{box-shadow:0 0 0 14px transparent}}
.vA .radar .now{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-mono);font-size:.6rem;color:var(--mute);letter-spacing:.1em}
.vA .days{display:grid;gap:.5rem}
.vA .day{display:grid;grid-template-columns:5.2em 1fr;gap:.6rem;border-left:2px solid var(--line);padding-left:.7rem}
.vA .day.today{border-color:var(--cy)}
.vA .day .d{font-family:var(--f-mono);color:var(--mute);font-size:.8rem;line-height:1.3;text-transform:uppercase}
.vA .day.today .d{color:var(--cy)}
.vA .day .d b{display:block;font-size:1.5rem;color:var(--fg);font-weight:400}
.vA .ev{display:flex;align-items:center;gap:.5rem;padding:.2rem 0;font-size:1.02rem;font-weight:500}
.vA .ev time{font-family:var(--f-mono);color:var(--mute);font-size:.82rem;min-width:3.4em}
.vA .av{width:1.45em;height:1.45em;border-radius:3px;display:inline-grid;place-items:center;font-family:var(--f-display);font-size:.62rem;font-weight:700;background:var(--c);color:#031018;box-shadow:0 0 10px var(--c);flex:none}
/* бюджет */
.vA .gauge{display:grid;grid-template-columns:auto 1fr;gap:.8rem;align-items:center}
@media (max-width:640px){.vA .gauge{grid-template-columns:1fr}}
.vA .gauge svg{width:150px;max-width:100%;height:auto;display:block;overflow:visible}
.vA .gauge .arc{fill:none;stroke-width:9;stroke-linecap:round}
.vA .gauge .track{stroke:rgba(56,224,255,.15)}
.vA .gauge .val{stroke:var(--cy);filter:drop-shadow(0 0 6px var(--cy));transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.vA .gauge .val.over{stroke:var(--bad);filter:drop-shadow(0 0 6px var(--bad))}
.vA .big{font-family:var(--f-display);font-size:clamp(1.6rem,3vw,2.3rem);font-weight:700;color:#fff;text-shadow:0 0 16px rgba(56,224,255,.7);line-height:1}
.vA .big small{font-size:.45em;color:var(--mute);font-weight:500;margin-left:.3em}
.vA .kv{display:grid;grid-template-columns:auto 1fr;gap:.15rem .8rem;font-family:var(--f-mono);font-size:.8rem;color:var(--mute);margin-top:.5rem}
.vA .kv b{color:var(--fg);font-weight:400;text-align:right}
.vA .tick{position:relative;height:6px;background:rgba(56,224,255,.12);margin-top:.6rem;overflow:hidden}
.vA .tick i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--cy),var(--mg));width:var(--w);animation:agrow 1.4s both cubic-bezier(.2,.8,.2,1)}
@keyframes agrow{from{width:0}}
.vA .tick b{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;left:var(--x)}
/* готвене */
.vA .meal{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;padding:.5rem 0;border-top:1px dashed var(--line)}
.vA .meal:first-of-type{border-top:0}
.vA .meal .slot{font-family:var(--f-mono);font-size:.7rem;color:var(--mute);letter-spacing:.15em;text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg)}
.vA .meal .t{font-size:1.25rem;font-weight:600}
.vA .meal.dinner .t{font-size:1.6rem;color:#fff}
.vA .meal .m{color:var(--mute);font-size:.85rem}
.vA .meal .cook{display:flex;align-items:center;gap:.4rem;font-family:var(--f-mono);font-size:.8rem;color:var(--mute)}
/* меню */
.vA .week{display:grid;grid-template-columns:repeat(7,1fr);gap:.4rem}
@media (max-width:900px){.vA .week{grid-template-columns:repeat(4,1fr)}}
@media (max-width:640px){.vA .week{grid-template-columns:1fr 1fr}}
.vA .wd{border:1px solid var(--line);padding:.5rem .55rem;min-width:0;font-size:.85rem;position:relative}
.vA .wd.today{background:rgba(56,224,255,.1);box-shadow:inset 0 0 20px rgba(56,224,255,.15)}
.vA .wd h4{font-family:var(--f-mono);font-size:.7rem;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.3rem}
.vA .wd p{margin:.15rem 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vA .wd p.dn{font-weight:600}
.vA .vote{display:flex;gap:.3rem;margin-top:.35rem}
.vA .vote button{font-family:var(--f-mono);font-size:.7rem;padding:.15rem .4rem;border:1px solid var(--line);color:var(--mute);transition:all .2s}
.vA .vote button.on{border-color:var(--ok);color:var(--ok);box-shadow:0 0 8px rgba(93,255,176,.5)}
.vA .vote button.on.no{border-color:var(--bad);color:var(--bad);box-shadow:0 0 8px rgba(255,90,106,.5)}
/* списъци */
.vA .list li{display:flex;align-items:center;gap:.6rem;padding:.3rem 0;border-bottom:1px solid rgba(56,224,255,.12);font-size:1rem}
.vA .list li .ck{width:1.2em;height:1.2em;border:1px solid var(--cy);display:grid;place-items:center;flex:none;font-size:.7rem;color:var(--ok);transition:all .25s}
.vA .list li.done{color:var(--mute);text-decoration:line-through}
.vA .list li.done .ck{background:var(--ok);color:#031018;box-shadow:0 0 10px var(--ok)}
.vA .list li .q{margin-left:auto;font-family:var(--f-mono);font-size:.78rem;color:var(--mute);white-space:nowrap}
.vA .list li .tag{font-family:var(--f-mono);font-size:.65rem;color:var(--am);border:1px solid rgba(255,196,77,.5);padding:0 .35em;letter-spacing:.05em}
.vA .prog{font-family:var(--f-mono);font-size:.75rem;color:var(--mute);margin-top:.5rem;display:flex;align-items:center;gap:.5rem}
.vA .prog i{flex:1;height:3px;background:rgba(56,224,255,.12);position:relative}
.vA .prog i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--ok);transition:width .4s}
/* тегло */
.vA .wchart{width:100%;height:auto;display:block;overflow:visible}
.vA .wchart .ln{fill:none;stroke:var(--cy);stroke-width:2;stroke-linejoin:round;stroke-dasharray:600;stroke-dashoffset:600;animation:adraw 2s 1.2s forwards ease-out;filter:drop-shadow(0 0 5px var(--cy))}
@keyframes adraw{to{stroke-dashoffset:0}}
.vA .wchart .ar{fill:url(#agA);opacity:0;animation:afade 1s 2.4s forwards}
@keyframes afade{to{opacity:1}}
.vA .wchart .goal{stroke:var(--ok);stroke-dasharray:4 4;stroke-width:1}
.vA .wchart text{font-family:var(--f-mono);font-size:9px;fill:var(--mute)}
.vA .wchart .end{fill:#fff;filter:drop-shadow(0 0 6px var(--cy))}
/* тикер */
.vA .ticker{overflow:hidden;white-space:nowrap;font-family:var(--f-mono);font-size:.9rem;padding:.5rem 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:.9rem;position:relative}
.vA .ticker span{display:inline-block;padding-left:100%;animation:atick 32s linear infinite}
.vA .ticker em{color:var(--am);font-style:normal}
.vA .ticker b{color:var(--mg);font-weight:400}
@keyframes atick{to{transform:translateX(-100%)}}
.vA .ticker:hover span{animation-play-state:paused}

/* =================================================================================
   B · STEAMPUNK
   ================================================================================= */
.vB{--bg:#2b1d12;--paper:#efe0bf;--paper2:#e2cfa5;--ink:#2a1a0c;--mute:#7a5a3a;--brass:#c9962e;--brass2:#8a5f16;--copper:#b0562a;--verd:#3f7a63;--red:#9b2f22;
  --f-display:"Cinzel Decorative",serif;--f-body:"IM Fell English",Georgia,serif;--f-type:"Special Elite",ui-monospace,monospace;
  background:var(--bg);color:var(--ink);font-family:var(--f-body);color-scheme:light}
.vB .world{background:
  radial-gradient(ellipse at 50% 0%,rgba(201,150,46,.18),transparent 60%),
  repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 2px,transparent 2px 38px),
  linear-gradient(#3a2816,#241709)}
.vB .plate{background:linear-gradient(135deg,#e7b85a,#b7822a 40%,#d9a94a 60%,#8a5f16);border-radius:10px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.5)}
.vB .plate>div{background:linear-gradient(#f3e6c8,var(--paper));border-radius:6px;padding:.9rem 1rem;position:relative;min-width:0;height:100%;
  background-image:radial-gradient(rgba(122,90,58,.08) 1px,transparent 1px),linear-gradient(#f3e6c8,var(--paper));background-size:9px 9px,100% 100%}
.vB .plate>div::before,.vB .plate>div::after,.vB .rv1,.vB .rv2{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f1d58a,#7d5611);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.vB .plate>div::before{left:6px;top:6px}.vB .plate>div::after{right:6px;top:6px}.vB .rv1{left:6px;bottom:6px}.vB .rv2{right:6px;bottom:6px}
.vB .head{display:grid;grid-template-columns:auto 1fr auto;gap:1.2rem;align-items:center;margin-bottom:1.1rem}
@media (max-width:760px){.vB .head{grid-template-columns:1fr;text-align:center}}
.vB .title{font-family:var(--f-display);font-size:clamp(1.2rem,2.6vw,2rem);color:var(--brass);text-shadow:0 2px 0 #3a2300,0 0 20px rgba(201,150,46,.4);text-align:center}
.vB .title small{display:block;font-family:var(--f-body);font-style:italic;font-size:.5em;color:#d8bf86;letter-spacing:.1em;text-shadow:none}
.vB .gear{color:var(--brass);filter:drop-shadow(0 3px 3px rgba(0,0,0,.5));width:var(--s,90px);height:var(--s,90px);animation:bspin var(--t,14s) linear infinite;flex:none}
.vB .gear.rev{animation-direction:reverse}
@keyframes bspin{to{transform:rotate(360deg)}}
.vB .gearset{display:flex;align-items:center;gap:-10px}
.vB .pend{width:120px;height:120px;position:relative;margin:0 auto}
.vB .pend .face{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff7df,#e2cfa5 70%);border:7px solid var(--brass);box-shadow:0 6px 16px rgba(0,0,0,.5),inset 0 0 8px rgba(0,0,0,.25);display:grid;place-items:center;font-family:var(--f-type);font-size:1.3rem;color:var(--ink)}
.vB .pend .face small{display:block;font-size:.55rem;text-align:center;color:var(--mute);letter-spacing:.1em}
.vB .pend .rod{position:absolute;left:50%;top:95%;width:4px;height:60px;background:linear-gradient(90deg,#8a5f16,#e7b85a,#8a5f16);transform-origin:top;animation:bswing 2s ease-in-out infinite alternate;margin-left:-2px}
.vB .pend .rod::after{content:"";position:absolute;bottom:-14px;left:50%;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f1d58a,#7d5611)}
@keyframes bswing{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.vB .brow{display:grid;grid-template-columns:repeat(12,1fr);gap:1rem}
.vB .s3{grid-column:span 3}.vB .s4{grid-column:span 4}.vB .s5{grid-column:span 5}.vB .s6{grid-column:span 6}.vB .s7{grid-column:span 7}.vB .s8{grid-column:span 8}.vB .s12{grid-column:span 12}
@media (max-width:1100px){.vB .s3,.vB .s4,.vB .s5{grid-column:span 6}.vB .s7,.vB .s8{grid-column:span 12}}
@media (max-width:640px){.vB .brow>*{grid-column:span 12}}
.vB h2{font-family:var(--f-display);font-size:.85rem;color:var(--brass2);letter-spacing:.06em;text-align:center;margin-bottom:.6rem;position:relative}
.vB h2::before,.vB h2::after{content:"❦";font-family:serif;margin:0 .5em;color:var(--copper);font-size:.9em}
/* сплит-флап календар */

function fxA(ctx,W,H,t){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#03060f';ctx.fillRect(0,0,W,H);
  // хекс-мрежа, бавно пулсира
  ctx.strokeStyle='rgba(56,224,255,.07)';ctx.lineWidth=1;const s=42,h=s*Math.sqrt(3)/2;
  for(let y=-h;y<H+h;y+=h*2)for(let x=-s;x<W+s;x+=s*3){for(const[ox,oy]of[[0,0],[s*1.5,h]]){ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i;ctx.lineTo(x+ox+Math.cos(a)*s*.5,y+oy+Math.sin(a)*s*.5)}ctx.closePath();ctx.stroke()}}
  // частици
  for(const p of fxA.ps){p.y-=p.v;if(p.y<0){p.y=H;p.x=Math.random()*W}ctx.fillStyle=`rgba(56,224,255,${p.a})`;ctx.fillRect(p.x,p.y,1.5,p.l)}
  // хоризонтален скан
  const sy=(t/18)%(H+200)-100;const gr=ctx.createLinearGradient(0,sy-60,0,sy+60);gr.addColorStop(0,'rgba(56,224,255,0)');gr.addColorStop(.5,'rgba(56,224,255,.12)');gr.addColorStop(1,'rgba(56,224,255,0)');ctx.fillStyle=gr;ctx.fillRect(0,sy-60,W,120);
}

      <ul class="ticket"><span class="stamp">№ 0427</span>${SHOP.map((s,i)=>`<li class="${s.ck?'done':''}"><button class="ck" data-shop="${i}" aria-label="Отметни ${esc(s.n)}"></button>${esc(s.n)} ${s.promo?`<span class="aisle">${esc(s.promo)}</span>`:''}<span class="q">${s.q}</span></li>`).join('')}
        <li style="border:0;color:var(--mute);font-size:.8rem;justify-content:flex-end">взети ${SHOP.filter(s=>s.ck).length} от ${SHOP.length}</li></ul>
    </div></div>
    <div class="plate s4"><div><span class="rv1"></span><span class="rv2"></span><h2>Наряди</h2>
      <ul class="tags">${TASKS.map((t,i)=>`<li class="${t.ck?'done':''}"><button data-task="${i}" aria-label="Готово ${esc(t.n)}" style="position:absolute;inset:0"></button>${esc(t.n)}<span class="who">${P[t.w].i} · ${t.due}</span></li>`).join('')}</ul>
      <h2 style="margin-top:.9rem">Сутрешна Гимнастика</h2>
      <ul class="wo">${WORK.map((w,i)=>`<li class="${w.ck?'done':''}"><button class="ck" data-work="${i}" aria-label="Направено ${esc(w.n)}">${w.ck?'✓':''}</button>${esc(w.n)}<span class="sets">${w.s}</span></li>`).join('')}</ul>
    </div></div>
    <div class="plate s4"><div><span class="rv1"></span><span class="rv2"></span><h2>Кантар на Господаря</h2>
      <div class="bigb num">${WEIGHT.pts.at(-1).toFixed(1)}<small> кг · цел ${WEIGHT.goal}</small></div>
      <div class="scale"><div class="ticks"></div><div class="goal" style="--x:${wx(WEIGHT.goal)}"></div><div class="pin" style="--x:${wx(WEIGHT.pts.at(-1))}"></div>
        <span class="lab" style="left:${wx(WEIGHT.goal)}">${WEIGHT.goal}</span><span class="lab" style="left:${wx(WEIGHT.pts[0])}">${WEIGHT.pts[0]}</span><span class="lab" style="left:${wx(WEIGHT.pts.at(-1))};color:var(--red)">${WEIGHT.pts.at(-1)}</span></div>
      <div class="hist" aria-label="8 седмици">${WEIGHT.pts.map(v=>`<i style="--h:${Math.round((v-hmin)/(hmax-hmin)*100)}%" title="${v}"></i>`).join('')}</div>
      <div style="font-family:var(--f-type);font-size:.78rem;color:var(--mute);margin-top:.3rem">Осем седмици · ${(WEIGHT.pts[0]-WEIGHT.pts.at(-1)).toFixed(1)} кг по-малко</div>
      <h2 style="margin-top:.9rem">Телеграма · Промоции</h2>
      <div class="tele" data-tele>${PROMO.map(p=>`${p.s} STOP ${p.n} <b>${p.p}</b> ${p.until} STOP`).join('\n')}\nРЕЦЕПТИ В РЕГИСТЪРА ${RECIPES.total} STOP НОВИ ${RECIPES.fresh} STOP</div>
    </div></div>
  </div></div></section>`;
}
function afterB(){
  // телеграмата се „пише“ буква по буква
  const t=$('[data-tele]');if(!t)return;const full=t.innerHTML;let i=0;t.innerHTML='';t.classList.add('cur');
  const txt=document.createElement('span');t.appendChild(txt);
  const plain=full.replace(/<[^>]+>/g,'');
  const iv=setInterval(()=>{i+=2;txt.textContent=plain.slice(0,i);if(i>=plain.length){clearInterval(iv);t.innerHTML=full}},18);
}
function fxB(ctx,W,H,t){
  ctx.clearRect(0,0,W,H);
  // пара и прах
  for(const p of fxB.ps){p.y-=p.v;p.x+=Math.sin(t/900+p.s)*.3;p.r+=.05;if(p.y<-60){p.y=H+40;p.x=Math.random()*W;p.r=8+Math.random()*10}
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,`rgba(255,240,210,${p.a*(1-p.r/90)})`);g.addColorStop(1,'rgba(255,240,210,0)');ctx.fillStyle=g;ctx.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2)}
  for(const d of fxB.dust){d.x+=d.vx;d.y+=d.vy;if(d.x<0||d.x>W)d.vx*=-1;if(d.y<0||d.y>H)d.vy*=-1;ctx.fillStyle=`rgba(255,220,150,${d.a})`;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,7);ctx.fill()}
}
fxB.ps=Array.from({length:14},()=>({x:Math.random()*2000,y:Math.random()*1200,v:.25+Math.random()*.4,r:8+Math.random()*30,a:.08+Math.random()*.08,s:Math.random()*9}));
fxB.dust=Array.from({length:60},()=>({x:Math.random()*2000,y:Math.random()*1200,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,r:.6+Math.random()*1.4,a:.15+Math.random()*.4}));

/* ---------------- ВАРИАНТ C · ОРГАНИЗЪМ ---------------- */
function renderC(){
  const g=weightPath(300,100,14);
  const lvl=100-pct; // ниво на течността (остатък)
  const doneW=WORK.filter(w=>w.ck).length, rC=34, Cc=2*Math.PI*rC;
  return `<section class="vC" style="min-height:100%">
  <div class="org">
    <article class="core">
      <div class="t num" data-clock>${clockStr()}</div><div class="d">${dateStr()}</div>
      <h3>Днес</h3>
      ${CAL[0].ev.map(e=>`<div class="cev"><time>${e.t}</time><span class="orb" style="--c:${P[e.w].c}">${P[e.w].i}</span>${esc(e.n)}</div>`).join('')}
      <h3>На масата</h3>
      <div class="cook"><div class="ln">☼ ${MENU[0].l} <small>· 13:00</small></div><div class="dn">${MENU[0].dn}</div><small>19:30 · готви <span class="orb" style="--c:${P[MENU[0].cook].c}">${P[MENU[0].cook].i}</span> ${P[MENU[0].cook].n} · 4 порции</small></div>
      <div class="meta" style="margin-top:1rem;font-size:.75rem">календар ${SYNC.cal} · wallet ${SYNC.wallet}</div>
    </article>
    <article class="cell c-budget ${over?'over':''}" style="--i:0"><h2>Бюджет <span>октомври</span></h2>
      <div class="vial"><svg viewBox="0 0 70 110" aria-hidden="true"><defs><clipPath id="cv"><rect x="8" y="6" width="54" height="98" rx="27"/></clipPath></defs>
        <rect x="8" y="6" width="54" height="98" rx="27" fill="rgba(60,247,196,.06)" stroke="rgba(60,247,196,.4)"/>
        <g clip-path="url(#cv)"><path class="liq" d="M-80,${6+98*(1-lvl/100)} q20,-6 40,0 t40,0 t40,0 t40,0 t40,0 V110 H-80Z" fill="rgba(60,247,196,.55)"/><path class="liq" style="animation-duration:6s;animation-direction:reverse" d="M-80,${10+98*(1-lvl/100)} q20,-5 40,0 t40,0 t40,0 t40,0 t40,0 V110 H-80Z" fill="rgba(124,183,255,.35)"/></g>
        <line x1="8" x2="62" y1="${6+98*(1-dayPct/100)}" y2="${6+98*(1-dayPct/100)}" stroke="#ffb76b" stroke-dasharray="2 3"/><text x="64" y="${9+98*(1-dayPct/100)}" fill="#ffb76b" font-size="7" font-weight="700">ден ${BUDGET.day}</text></svg>
        <div><div class="bigc num">${fmt(BUDGET.rem)}<small>лв остават</small></div><div class="meta">похарчени <b class="num">${fmt(BUDGET.spent)}</b> от <b class="num">${fmt(BUDGET.limit)}</b><br>до края ~<b class="num">${BUDGET.pace} лв/ден</b></div></div></div></article>
    <article class="cell c-menu" style="--i:1"><h2>Меню <span>гласуване до нд 20:00</span></h2>
      <div class="vine">${MENU.map((m,i)=>{const sum=m.v.D+m.v.S;const st=m.v.D===0&&m.v.S===0?'wait':sum<0||m.v.D<0||m.v.S<0?'no':'';return `<div class="${i?'':'today'}" style="--i:${i}"><h4>${m.d}</h4><div class="pod ${st}">${P[m.cook].i}</div><p title="${esc(m.dn)}">${esc(m.dn)}</p><div class="cv">${voteBtns(m,i)}</div></div>`}).join('')}</div></article>
    <article class="cell c-shop" style="--i:2"><h2>Пазаруване <span>${SHOP.filter(s=>s.ck).length}/${SHOP.length}</span></h2>
      <div class="bubbles">${SHOP.map((s,i)=>`<button class="${s.ck?'done':''}" data-shop="${i}">${esc(s.n)} <small>${s.q}</small>${s.promo?` <small style="color:var(--warm)">${esc(s.promo)}</small>`:''}</button>`).join('')}</div>
      <div class="tline">Списъкът е роден от менюто. Докосни, когато е в количката.</div></article>
    <article class="cell c-tasks" style="--i:3"><h2>Задачи <span>${TASKS.filter(t=>!t.ck).length} отворени</span></h2>
      <ul class="tasks">${TASKS.map((t,i)=>`<li class="${t.ck?'done':''}"><button class="ck" data-task="${i}" aria-label="Готово ${esc(t.n)}">${t.ck?'✓':''}</button>${esc(t.n)}<span class="who"><span class="orb" style="--c:${P[t.w].c}">${P[t.w].i}</span> <small style="color:var(--mute)">${t.due}</small></span></li>`).join('')}</ul></article>
    <article class="cell c-weight" style="--i:4"><h2>Тегло <span>Дако · цел ${WEIGHT.goal}</span></h2>
      <div class="bigc num">${WEIGHT.pts.at(-1).toFixed(1)}<small>кг · −${(WEIGHT.pts[0]-WEIGHT.pts.at(-1)).toFixed(1)}</small></div>
      <svg class="wsvg" viewBox="0 0 300 100" aria-label="Тегло, 8 седмици"><defs><linearGradient id="cgC" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3cf7c4" stop-opacity=".3"/><stop offset="1" stop-color="#3cf7c4" stop-opacity="0"/></linearGradient></defs>
        <path class="ar" d="${g.area}"/><line class="goal" x1="14" x2="286" y1="${g.gy}" y2="${g.gy}"/><path class="ln" d="${g.d}"/>${WEIGHT.pts.map((v,i)=>`<circle class="pt" cx="${g.x(i)}" cy="${g.y(v)}" r="${i===7?4:2.2}"/>`).join('')}<text x="286" y="${g.gy-3}" text-anchor="end">цел ${WEIGHT.goal}</text></svg></article>
    <article class="cell c-work" style="--i:5"><h2>Тренировка <span>сутрин · ластици и тежести</span></h2>
      <div class="rings"><svg viewBox="0 0 84 84" aria-hidden="true"><circle class="r" cx="42" cy="42" r="${rC}" stroke="rgba(124,183,255,.15)"/><circle class="r" cx="42" cy="42" r="${rC}" stroke="#7cb7ff" stroke-dasharray="${Cc}" stroke-dashoffset="${Cc*(1-doneW/WORK.length)}" style="filter:drop-shadow(0 0 6px #7cb7ff)"/><text x="42" y="47" text-anchor="middle" fill="#fff" font-size="16" font-weight="800" font-family="Comfortaa">${doneW}/${WORK.length}</text></svg>
        <ul class="ex">${WORK.map((w,i)=>`<li class="${w.ck?'done':''}"><button data-work="${i}" aria-label="Направено ${esc(w.n)}">${w.ck?'✓':''}</button>${esc(w.n)}<small>${w.s}</small></li>`).join('')}</ul></div></article>
    <article class="cell c-days" style="--i:6"><h2>Следващите дни <span>Google Calendar</span></h2>
      <div class="days">${CAL.slice(1).map(d=>{const dt=addD(TODAY,d.o);return `<div><h4><b class="num">${dt.getDate()}</b>${DOWL[dt.getDay()]}</h4>${d.ev.map(e=>`<div class="cev" style="justify-content:flex-start"><time>${e.t}</time><span class="orb" style="--c:${P[e.w].c}">${P[e.w].i}</span>${esc(e.n)}</div>`).join('')}</div>`}).join('')}</div></article>
    <article class="cell c-promo" style="--i:7"><h2>Промоции <span>${SYNC.promo} · ${RECIPES.total} рецепти, ${RECIPES.fresh} нови</span></h2>
      <div class="spores">${PROMO.map((p,i)=>`<span class="spore" style="--i:${i}">${p.s} · ${esc(p.n)} <b>${p.p}</b> <small>${p.until}</small></span>`).join('')}</div></article>
  </div></section>`;
}
function fxC(ctx,W,H,t){
  ctx.clearRect(0,0,W,H);
  const ps=fxC.ps;
  for(const p of ps){p.x+=p.vx+Math.sin(t/2000+p.s)*.15;p.y+=p.vy+Math.cos(t/2300+p.s)*.15;
    if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20;
    const a=p.a*(.6+.4*Math.sin(t/700+p.s));const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3);g.addColorStop(0,`rgba(60,247,196,${a})`);g.addColorStop(1,'rgba(60,247,196,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*3,0,7);ctx.fill()}
  ctx.lineWidth=1;
  for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){const dx=ps[i].x-ps[j].x,dy=ps[i].y-ps[j].y,d=dx*dx+dy*dy;if(d<16000){ctx.strokeStyle=`rgba(60,247,196,${(1-d/16000)*.25})`;ctx.beginPath();ctx.moveTo(ps[i].x,ps[i].y);ctx.lineTo(ps[j].x,ps[j].y);ctx.stroke()}}
  if(fxC.m){for(const p of ps){const dx=p.x-fxC.m.x,dy=p.y-fxC.m.y,d=dx*dx+dy*dy;if(d<40000){ctx.strokeStyle=`rgba(124,183,255,${(1-d/40000)*.5})`;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(fxC.m.x,fxC.m.y);ctx.stroke()}}}
}
fxC.ps=Array.from({length:70},()=>({x:Math.random()*2000,y:Math.random()*1200,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:1+Math.random()*2.2,a:.3+Math.random()*.5,s:Math.random()*9}));
addEventListener('pointermove',e=>fxC.m={x:e.clientX,y:e.clientY});

/* ---------------- СЦЕНА И ПРЕВКЛЮЧВАТЕЛ ---------------- */
const VARIANTS={A:{name:'Холограма',render:renderA,after:afterA,fx:fxA},B:{name:'Steampunk',render:renderB,after:afterB,fx:fxB},C:{name:'Организъм',render:renderC,fx:fxC}};
const KEYS=Object.keys(VARIANTS);
function currentKey(){const q=new URLSearchParams(location.search).get('variant');const h=location.hash.replace('#','');return KEYS.includes(q)?q:KEYS.includes(h)?h:'A'}
let cur=currentKey();
function setKey(k){cur=k;try{const u=new URL(location);if(u.protocol.startsWith('http')&&!/claude\.ai$/.test(u.hostname)){u.searchParams.set('variant',k);history.replaceState(null,'',u)}else{history.replaceState(null,'',`#${k}`)}}catch(e){}render()}
function render(){
  const v=VARIANTS[cur];
  $('#root').innerHTML=v.render();
  $('#root').className='world';
  document.body.style.background=cur==='B'?'#2b1d12':cur==='C'?'#020b10':'#03060f';
  $('#lbl').innerHTML=`${cur} <small>· ${v.name}</small>`;
  v.after&&v.after();
  $('#root').onclick=onAction;
}
function onAction(e){
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(d.shop!=null){SHOP[d.shop].ck=!SHOP[d.shop].ck}
  else if(d.task!=null){TASKS[d.task].ck=!TASKS[d.task].ck}
  else if(d.work!=null){WORK[d.work].ck=!WORK[d.work].ck}
  else if(d.vote){const[i,u]=d.vote.split(':');const m=MENU[+i];m.v[u]=m.v[u]===1?-1:m.v[u]===-1?0:1}
  else return;
  // пререндер без повторно входно анимиране на панелите
  const scroll=scrollY;render();document.querySelectorAll('.vA .p,.vB .flap,.vB .needle,.vB .pin,.vB .hist i,.vA .tick i,.vA .wchart .ln,.vC .wsvg .ln').forEach(el=>{el.style.animation='none'});
  document.querySelectorAll('.vA .wchart .ln,.vC .wsvg .ln').forEach(el=>el.style.strokeDashoffset='0');document.querySelectorAll('.vA .wchart .ar').forEach(el=>el.style.opacity='1');
  document.querySelectorAll('[data-count]').forEach(el=>el.textContent=fmt(+el.dataset.count));
  scrollTo(0,scroll);
}
$('#prev').onclick=()=>setKey(KEYS[(KEYS.indexOf(cur)+KEYS.length-1)%KEYS.length]);
$('#next').onclick=()=>setKey(KEYS[(KEYS.indexOf(cur)+1)%KEYS.length]);
addEventListener('keydown',e=>{const t=e.target;if(t.matches('input,textarea,[contenteditable]'))return;
  if(e.key==='ArrowRight')$('#next').click();if(e.key==='ArrowLeft')$('#prev').click()});
addEventListener('hashchange',()=>{const k=currentKey();if(k!==cur){cur=k;render()}});

/* часовник */
setInterval(()=>document.querySelectorAll('[data-clock]').forEach(el=>el.textContent=clockStr()),1000);

/* фон-канвас */
const cv=$('#fx'),ctx=cv.getContext('2d');let W,H;
function resize(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}
addEventListener('resize',resize);resize();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(t){VARIANTS[cur].fx(ctx,W,H,t);if(!reduce)requestAnimationFrame(loop)}
requestAnimationFrame(loop);
render();
</script>
</body>
