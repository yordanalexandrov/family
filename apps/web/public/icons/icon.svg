<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Семейство</title>
  <!-- Монограм „С“ (Семейство): дъга върху акцентния цвят (токен color-accent, светла тема).
