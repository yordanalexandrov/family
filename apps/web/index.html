    <meta name="description" content="Семейна платформа: календар, бюджет и храна на един екран." />

    <title>Семейна платформа</title>
    <meta name="theme-color" content="#eef1f8" />
    <!--
      Статичен екран, докато React не замени #root (#174): на бавна мрежа студеното отваряне иначе е празно с
      секунди. Цветовете са --color-bg, --color-text-muted от src/styles/tokens.css. Скриптът избира темата като
      applyStoredTheme в src/app/theme.ts (family.theme; без нея auto на kiosk и TV, иначе system) и слага
      data-theme и theme-color; src/app/boot-screen.spec.ts пази двете еднакви. Логото е icons/icon-192.png като
      webp, вградено, за да не чака отделна заявка зад bundle-а.
    -->
    <script>
      {
        let setting = null;
        let mode = null;
        try {
          setting = localStorage.getItem('family.theme');
          mode = localStorage.getItem('family.deviceMode');
        } catch (_) {}
        if (setting !== 'light' && setting !== 'dark' && setting !== 'system' && setting !== 'auto') {
          setting = mode === 'kiosk' || mode === 'tv' ? 'auto' : 'system';
        }
        let theme = setting;
        if (setting === 'auto') {
          // themeForHour: тъмна от 20:00 до 07:00 в София.
          const hour = Number(
            new Intl.DateTimeFormat('en-US', { timeZone: 'Europe/Sofia', hourCycle: 'h23', hour: '2-digit' }).format(
              new Date(),
            ),
          );
          theme = hour >= 20 || hour < 7 ? 'dark' : 'light';
        } else if (setting === 'system') {
          theme = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.content = theme === 'dark' ? '#07080f' : '#eef1f8';
        }
      }
    </script>
    <style>
      .boot {
        --boot-bg: #eef1f8;
        --boot-text: #4c5570;
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: var(--boot-bg);
        color: var(--boot-text);
        font: 600 16px/1.3 system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) .boot {
          --boot-bg: #07080f;
          --boot-text: #a2a6b8;
        }
      }
      :root[data-theme='dark'] .boot {
        --boot-bg: #07080f;
        --boot-text: #a2a6b8;
      }
      .boot__logo {
        width: 96px;
        height: 96px;
        border-radius: 22px;
      }
      .boot__text {
        margin: 0;
      }
    </style>
