name: family

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: family
      POSTGRES_USER: family
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family -d family"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Throwaway database for `pnpm test` (DATABASE_URL_TEST): in-memory, fixed password, only under the `test` profile.
  postgres-test:
    profiles: [test]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: family
      POSTGRES_USER: family
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family -d family"]
      interval: 5s
      timeout: 5s
      retries: 10

  # api и caddy са на host мрежата и слушат само на loopback (docs/adr/0005-api-and-caddy-on-host-network.md).
  api:
    build:
      context: .
      target: api
    network_mode: host
    env_file: .env
    environment:
      NODE_ENV: production
      API_HOST: 127.0.0.1
      API_PORT: "18091"
      DATABASE_URL: postgres://family:${POSTGRES_PASSWORD}@127.0.0.1:5432/family
      AUTH_MODE: cloudflare
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Статиката на web + прокси към api на 127.0.0.1:18090; cloudflared сочи тук (infra/caddy/Caddyfile).
  caddy:
    build:
      context: .
      target: web
    network_mode: host
    depends_on:
      - api
    restart: unless-stopped

  # Всяка нощ в 03:00 (TZ) pg_dump в /srv/family/backups, пази 14 дни (infra/backup/backup.sh).
  backup:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: family
      PGDATABASE: family
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Sofia}
    volumes:
      - /srv/family/backups:/backups
      - ./infra/backup/backup.sh:/usr/local/bin/backup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
